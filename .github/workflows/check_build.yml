name: Check Build

on:
  pull_request:
    branches: [ main, dev ]
    types: [ opened, synchronize, reopened, ready_for_review ]

jobs:
  build:
    if: github.event.pull_request.draft == false
    strategy:
      matrix:
        java: [ 25 ]
        os: [ ubuntu-latest ]
    name: Build the project (Java ${{ matrix.java }}, on ${{ matrix.os }}))
    runs-on: ${{ matrix.os }}
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Make Gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew

      # Must stay a separate invocation: the game tests read the generated data pack, and it can only
      # be picked up by `processResources` once it has been written to disk.
      - name: Generate data files
        run: ./gradlew runDatagen

      - name: Build
        run: ./gradlew build -x test -x runGameTest

      # Plain JUnit tests, running against a bootstrapped Minecraft but without any world.
      - name: Run unit tests
        run: ./gradlew test

      # Game tests, running inside a headless Minecraft server.
      - name: Run game tests
        run: ./gradlew runGameTest

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-java${{ matrix.java }}-${{ matrix.os }}
          path: |
            mubble-test/build/reports/tests/
            mubble-test/build/test-results/
            mubble-test/build/run/gameTest/logs/
          if-no-files-found: ignore
          retention-days: 7

pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        gradlePluginPortal()
    }
}

rootProject.name = 'mubble'

include 'mubble-bom'

include 'mubble-core'
include 'mubble-super_mario'

// Single module holding the tests of every other module. Must stay last so that
// the modules it depends on are already evaluated.
include 'mubble-test'
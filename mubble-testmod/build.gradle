version = getSubprojectVersion(project)

// The sandbox sits on top of every shipped module, so that it can build on all of them.
moduleDependencies(project, [
    'mubble-core',
    'mubble-super_mario',
    'mubble-arcade',
])

loom {
    // Dev-only modules are skipped by the mod registration of the root build script, so this one has
    // to register itself for its own runs.
    mods.register(project.name) {
        sourceSet sourceSets.main
        sourceSet sourceSets.client
    }

    runs {
        client {
            name = "Minecraft Client with Test Mod"
            ideConfigGenerated = true
        }
        server {
            name = "Minecraft Server with Test Mod"
            ideConfigGenerated = true
        }
    }
}

// Note: no data generation here on purpose. The data pack is small enough to be written by hand,
// and doing so keeps the sandbox content editable without a build.

// Its jars are still built, so that the module behaves like any other, but the root build script
// keeps them out of the BOM, out of the release jar and out of anything published.

// `-Pcontrolify` loads Controlify in the client of the sandbox, to play the arcade movement with a
// controller. Off by default: Mubble only compiles against it, and nobody's dev client should change.
if (project.hasProperty('controlify')) {
    repositories {
        maven {
            name = 'isXander'
            url = 'https://maven.isxander.dev/releases'
            // only the jars are wanted, not the multi-loader variants their metadata describes
            metadataSources {
                artifact()
            }
            content {
                includeGroup 'dev.isxander'
            }
        }
    }
    dependencies {
        clientRuntimeOnly 'dev.isxander:controlify:3.5.3+mc26.2:fabric@jar'
        // the config library Controlify depends on
        clientRuntimeOnly 'dev.isxander:yet-another-config-lib:3.9.7+26.2-fabric@jar'
        // the config library has a @Redirect that MixinExtras only reads from 0.5.5 on, a version past
        // the one the loader brings
        clientRuntimeOnly 'io.github.llamalad7:mixinextras-fabric:0.5.5'
    }
}

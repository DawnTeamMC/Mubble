version = getSubprojectVersion(project)

dependencies {
    // Runtime dimension lifecycle. Vanilla cannot create or destroy a level after boot, and voyages
    // need one temporary level per trial. See docs/runtime-worlds.md.
    implementation "xyz.nucleoid:fantasy:${fantasy_version}"
    include "xyz.nucleoid:fantasy:${fantasy_version}"
}

fabricApi {
    configureDataGeneration() {
        outputDirectory = file("src/generated/resources")
        modId = "mubble-datagen"
        createSourceSet = true
        client = true
    }
}

loom {
    runs {
        datagen {
            name "Data Generation"
            ideConfigGenerated = true
        }
    }
}
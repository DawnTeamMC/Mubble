project_id: "427504"
api_token_env: "CROWDIN_PERSONAL_TOKEN"
preserve_hierarchy: true

files:
  - source: "mubble-core/src/generated/resources/assets/mubble/lang/en_us.json"
    translation: "mubble-core/src/generated/resources/assets/mubble/lang/%locale_with_underscore%.json"
    dest: "mubble/core.json"
    import_eq_suggestions: 1
  - source: "mubble-super_mario/src/generated/resources/assets/super_mario/lang/en_us.json"
    translation: "mubble-super_mario/src/generated/resources/assets/super_mario/lang/%locale_with_underscore%.json"
    dest: "mubble/super_mario.json"
    import_eq_suggestions: 1
  - source: "docs/**/*.*"
    ignore:
      - "docs/.assets/**/*"
      - "docs/.translated/**/*"
      - "docs/sinytra-wiki.json"
    translation: "docs/.translated/%locale_with_underscore%/**/%original_file_name%"
    dest: "mubble-docs/**/%original_file_name%"
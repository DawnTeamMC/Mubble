project_id: "427504"
api_token_env: "CROWDIN_PERSONAL_TOKEN"
preserve_hierarchy: true

files:
  - source: "src/main/generated/assets/mubble/lang/en_us.json"
    translation: "src/main/generated/assets/mubble/lang/%locale_with_underscore%.json"
    dest: "mubble.json"
  - source: "docs/**/*.*"
    ignore:
      - "docs/.assets/**/*"
      - "docs/.translated/**/*"
      - "docs/sinytra-wiki.json"
    translation: "docs/.translated/%locale_with_underscore%/**/%original_file_name%"
    dest: "mubble-docs/**/%original_file_name%"